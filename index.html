<!DOCTYPE html> 
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>British Bird Vocalisation Library</title>
<style>
:root {
  --green:#526b59;--green-dark:#344b3c;--green-light:#e8eee7;
  --cream:#f7f6f0;--paper:#fffefa;--ink:#29342e;
  --muted:#788078;--line:#e5e5dc;
  --shadow:0 4px 18px rgba(38,55,43,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif;line-height:1.55}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0;border-radius:8px;padding:10px 15px;background:var(--green);color:white;font-weight:600}
button:hover{filter:brightness(.94)}
button.secondary{background:white;color:var(--green-dark);border:1px solid var(--line)}
button.danger{background:#a64f49}
button.small{padding:7px 11px;font-size:13px}
button.text-button{background:transparent;color:var(--green);padding:5px 0}
header{background:var(--green-dark);color:white;padding:20px 5%}
.header-inner{max-width:1250px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:13px}
.brand-icon{width:43px;height:43px;flex:none}
.brand h1{font-family:Georgia,serif;font-size:23px;margin:0;font-weight:normal}
.brand p{margin:2px 0 0;color:#d5dfd5;font-size:12px}
.header-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sync-pill{font-size:12px;color:#d5dfd5;padding:4px 8px;border-radius:6px;background:rgba(255,255,255,.1)}
main{max-width:1250px;margin:32px auto;padding:0 24px 60px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:25px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:220px;max-width:480px}
.search input{width:100%;padding:13px 15px 13px 40px;border:1px solid var(--line);border-radius:10px;background:white}
.search:before{content:"⌕";position:absolute;left:14px;top:6px;font-size:23px;color:var(--muted)}
.filter-row{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px;align-items:center}
.filter-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-right:4px}
.filter-pill{background:white;color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer}
.filter-pill:hover{background:var(--green-light);border-color:#c5d4c5}
.filter-pill.active{background:var(--green-dark);color:white;border-color:var(--green-dark)}
.eyebrow{color:var(--green);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:1.4px}
h2,h3,h4{font-family:Georgia,serif;font-weight:normal}
h2{font-size:29px;margin:5px 0}
h3{font-size:21px;margin:0 0 8px}
.muted{color:var(--muted)}
.species-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:19px}
.species-card{background:var(--paper);border:1px solid var(--line);border-radius:13px;overflow:hidden;cursor:pointer;transition:transform .15s,box-shadow .15s}
.species-card:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.species-card img{width:100%;height:175px;object-fit:cover;display:block;background:#e7e9e1}
.photo-placeholder{height:175px;display:flex;align-items:center;justify-content:center;background:var(--green-light);font-size:42px;color:var(--green)}
.species-card-content{padding:17px}
.species-card h3{margin:0 0 2px}
.scientific{font-family:Georgia,serif;font-style:italic;color:var(--muted);font-size:14px}
.species-meta{display:flex;gap:6px;align-items:center;margin-top:13px;flex-wrap:wrap}
.tag{background:var(--green-light);color:var(--green-dark);padding:4px 8px;border-radius:5px;font-size:11px;font-weight:700}
.tag.subtle{background:#f0f1ea;color:#536057}
.tag.status-resident{background:#e3efe5;color:#2c5234}
.tag.status-summer{background:#fbf2d5;color:#745812}
.tag.status-winter{background:#e2edf5;color:#274c68}
.tag.status-passage{background:#ece9f2;color:#4a3d63}
.count{font-size:12px;color:var(--muted)}
.back{margin-bottom:20px}
.species-hero{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:grid;grid-template-columns:minmax(220px,36%) 1fr;margin-bottom:27px}
.species-hero img{width:100%;height:100%;min-height:240px;max-height:330px;object-fit:cover}
.hero-placeholder{min-height:240px;background:var(--green-light);display:flex;align-items:center;justify-content:center}
.hero-content{padding:27px}
.hero-content h2{font-size:35px;margin:4px 0}
.hero-content .scientific{font-size:16px}
.hero-description{margin-top:15px;font-size:14px;color:#58635a}
.hero-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
.section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:27px 0 14px}
.section-heading h3{margin:0}
.vocal-card{background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.vocal-top{padding:17px 20px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:1px solid var(--line)}
.vocal-title{font-family:Georgia,serif;font-size:21px}
.vocal-content{padding:20px}
.vocal-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px 28px}
.info-block{min-width:0}
.info-block.full{grid-column:1/-1}
.info-label{font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:6px}
.info-text{white-space:pre-wrap;font-size:14px}
.species-link{color:var(--green-dark);font-weight:700;text-decoration:underline;text-decoration-color:#8da394;text-underline-offset:2px;cursor:pointer;background:var(--green-light);padding:1px 5px;border-radius:4px}
.species-link:hover{background:#d5e0d4}
.mnemonic{background:#f0f3ec;border-left:4px solid var(--green);padding:13px 16px;border-radius:5px;font-family:Georgia,serif;font-size:21px}
.recording{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.recording:first-of-type{border-top:0}
.recording audio{width:100%;max-width:470px;height:36px}
.recording-name{font-weight:600;font-size:13px}
.recording small{display:block;color:var(--muted);font-size:11px;overflow-wrap:anywhere}
.recordings{margin-top:20px}
.card-actions{display:flex;gap:7px;align-items:center}
.form-panel{background:white;border:1px solid var(--line);border-radius:13px;padding:22px;margin:18px 0;box-shadow:var(--shadow)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1/-1}
.field label{font-size:12px;font-weight:700;color:#536057}
.field input,.field textarea,.field select{width:100%;padding:10px 11px;border:1px solid #dcded6;border-radius:7px;background:#fffefa;color:var(--ink)}
.field textarea{min-height:90px;resize:vertical}
.field input:focus,.field textarea:focus,.field select:focus{outline:2px solid #c5d4c5;border-color:var(--green)}
.field-note{font-size:11px;color:var(--muted)}
.form-actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.recording-form{border:1px solid var(--line);padding:14px;border-radius:8px;margin:10px 0;background:#fafaf6}
.recording-form-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.empty{background:white;border:1px dashed #cbd2c8;border-radius:12px;padding:35px;text-align:center;color:var(--muted)}
.audio-preview{font-size:12px;color:var(--green-dark);margin-top:5px}
.hidden{display:none!important}
footer{text-align:center;padding:25px;color:var(--muted);font-size:11px}

/* Read-only mode by default; append ?edit=true to URL to show editing controls */
body:not(.edit-mode) .header-actions button,
body:not(.edit-mode) .toolbar button,
body:not(.edit-mode) .hero-actions,
body:not(.edit-mode) .card-actions,
body:not(.edit-mode) .form-panel {
  display: none !important;
}

@media(max-width:650px){
  main{padding:0 14px;margin-top:22px}
  .header-inner{align-items:flex-start;flex-direction:column}
  .species-hero{grid-template-columns:1fr}
  .species-hero img,.hero-placeholder{height:210px;min-height:210px}
  .hero-content{padding:20px}
  .vocal-grid,.form-grid{grid-template-columns:1fr}
  .info-block.full,.field.full{grid-column:auto}
  .recording{grid-template-columns:1fr}
  .recording-form-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 64 64" width="43" height="43" xmlns="http://www.w3.org/2000/svg" aria-label="Wader logo">
          <circle cx="32" cy="32" r="31" fill="#e8eee7"/>
          <path d="M8 46 Q20 42 31 46 T56 46" fill="none" stroke="#8da394" stroke-width="2"/>
          <path d="M13 51 Q25 47 37 51 T55 51" fill="none" stroke="#8da394" stroke-width="1.5"/>
          <path d="M14 35 Q22 27 31 25 Q38 23 43 27 Q47 30 44 35 Q39 41 29 40 Q20 40 14 35Z" fill="#344b3c"/>
          <path d="M40 28 Q45 20 51 19 Q55 19 54 22 Q51 26 45 30Z" fill="#344b3c"/>
          <path d="M53 21 L63 19 L54 24Z" fill="#526b59"/>
          <path d="M25 39 L23 49 M34 39 L36 49" stroke="#344b3c" stroke-width="2" stroke-linecap="round"/>
          <path d="M20 49 L26 49 M33 49 L39 49" stroke="#344b3c" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M17 35 Q24 28 33 29 Q28 35 22 37Z" fill="#526b59"/>
        </svg>
      </div>
      <div>
        <h1>British Bird Vocalisation Library</h1>
        <p>A reference guide to the sounds of British birds</p>
      </div>
    </div>
    <div class="header-actions">
      <span id="syncStatus" class="sync-pill">Connecting…</span>
      <button class="secondary small" onclick="document.getElementById('importDocxFile').click()">Import Word doc</button>
      <input id="importDocxFile" type="file" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden onchange="importWordDoc(event)">
      <button class="secondary small" onclick="exportBackup()">Export backup</button>
      <button class="secondary small" onclick="document.getElementById('importFile').click()">Import backup</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden onchange="importBackup(event)">
    </div>
  </div>
</header>

<main id="app"></main>
<footer>British Bird Vocalisation Library </footer>

<!-- Mammoth.js for parsing .docx Word tables in browser -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<!-- Firebase Cloud Firestore SDK (Compat CDN for standalone HTML) -->
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore-compat.js"></script>

<script>
const STORAGE_KEY = "birdDatabase";
const AUDIO_DB_NAME = "birdDatabaseFiles";
const AUDIO_STORE = "audio";
const BIRD_GROUPS = [
  "Tits",
  "Finches",
  "Thrushes",
  "Warblers",
  "Corvids",
  "Waders",
  "Gulls",
  "Ducks & geese",
  "Pigeons & doves",
  "Raptors & owls",
  "Woodpeckers",
  "Other"
];
const UK_STATUSES = [
  "Resident",
  "Summer migrant",
  "Winter visitor",
  "Passage migrant"
];

const app = document.getElementById("app");
const syncStatusEl = document.getElementById("syncStatus");

if (new URLSearchParams(window.location.search).get("edit") === "true") {
  document.body.classList.add("edit-mode");
}

/* Firebase configuration for bird-vocalisations */
const firebaseConfig = {
  apiKey: "AIzaSyAtpb4lMs8OTSyWkwtNIW35eSrmyJTFThY",
  authDomain: "bird-vocalisations.firebaseapp.com",
  projectId: "bird-vocalisations",
  storageBucket: "bird-vocalisations.firebasestorage.app",
  messagingSenderId: "48215509322",
  appId: "1:48215509322:web:805c91081ea49890fc59b3"
};

let cloudDB = null;
try {
  firebase.initializeApp(firebaseConfig);
  cloudDB = firebase.firestore();
  cloudDB.enablePersistence({ synchronizeTabs: true }).catch(() => {});
} catch(e) {
  console.warn("Firebase initialisation failed; running in local-only mode.", e);
}

function setSyncStatus(text) {
  if (syncStatusEl) syncStatusEl.textContent = text;
}

let db = loadDatabase();
let selectedSpecies = null;
let editingVocalisation = null;
let editingSpecies = false;
let addingSpecies = false;
let searchTerm = "";
let selectedGroup = "All";
let selectedStatus = "All";
let audioObjectUrls = [];

function sortDatabaseAlphabetically() {
  db.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
}

function uid() {
  return "id-" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
}
function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function statusBadgeHTML(status) {
  if (!status) return "";
  const cls = status === "Resident" ? "status-resident"
    : status === "Summer migrant" ? "status-summer"
    : status === "Winter visitor" ? "status-winter"
    : status === "Passage migrant" ? "status-passage"
    : "subtle";
  return `<span class="tag ${cls}">${esc(status)}</span>`;
}

/* Automatically turn mentions of other species in the database into clickable links */
function linkifySpecies(text, currentSpeciesId) {
  let escaped = esc(text);
  if (!escaped) return "";

  const candidates = [];
  db.forEach(s => {
    if (s.id === currentSpeciesId) return;
    if (s.name && s.name.trim().length > 2) {
      candidates.push({ term: s.name.trim(), id: s.id, name: s.name });
    }
    if (s.btoCode && s.btoCode.trim().length >= 2) {
      candidates.push({ term: s.btoCode.trim(), id: s.id, name: s.name, isBto: true });
    }
  });

  candidates.sort((a, b) => b.term.length - a.term.length);

  const tokens = [];
  candidates.forEach(c => {
    const safeTerm = esc(c.term).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const regex = c.isBto
      ? new RegExp(`\\b(${safeTerm})\\b`, 'g')
      : new RegExp(`\\b(${safeTerm}s?)\\b`, 'gi');

    escaped = escaped.replace(regex, match => {
      const placeholder = `@@SPECIESLINK_${tokens.length}@@`;
      tokens.push(`<a class="species-link" title="Open ${esc(c.name)}" onclick="openSpecies('${c.id}');window.scrollTo({top:0,behavior:'smooth'})">${match}</a>`);
      return placeholder;
    });
  });

  tokens.forEach((html, idx) => {
    escaped = escaped.replace(`@@SPECIESLINK_${idx}@@`, html);
  });

  return escaped;
}

/* Audio files are stored locally in IndexedDB and mirrored to Firestore. */
function openAudioDB() {
  return new Promise((resolve,reject) => {
    if (!("indexedDB" in window)) {
      reject(new Error("This browser does not support IndexedDB."));
      return;
    }
    const request = indexedDB.open(AUDIO_DB_NAME,1);
    request.onupgradeneeded = () => {
      const database = request.result;
      if (!database.objectStoreNames.contains(AUDIO_STORE)) {
        database.createObjectStore(AUDIO_STORE,{keyPath:"id"});
      }
    };
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}
async function putAudioFileLocal(id,file,nameOverride,typeOverride) {
  const database = await openAudioDB();
  return new Promise((resolve,reject) => {
    const transaction = database.transaction(AUDIO_STORE,"readwrite");
    transaction.objectStore(AUDIO_STORE).put({
      id,
      blob:file,
      name:nameOverride || file.name || "audio recording",
      type:typeOverride || file.type || "audio/mpeg"
    });
    transaction.oncomplete = () => {database.close();resolve(id);};
    transaction.onerror = () => {database.close();reject(transaction.error);};
  });
}
async function putAudioFile(id,file) {
  await putAudioFileLocal(id,file);
  if (cloudDB) {
    try {
      setSyncStatus("Uploading audio…");
      const audioData = await blobToDataURL(file);
      await cloudDB.collection("audio").doc(id).set({
        id,
        audioData,
        name: file.name || "audio recording",
        type: file.type || "audio/mpeg",
        updatedAt: Date.now()
      });
      setSyncStatus("● Online");
    } catch(e) {
      console.warn("Could not upload audio to Firestore (ensure file is under 700 KB)", e);
      setSyncStatus("⚠ Audio sync error");
    }
  }
  return id;
}
async function getAudioFileLocal(id) {
  const database = await openAudioDB();
  return new Promise((resolve,reject) => {
    const request = database.transaction(AUDIO_STORE,"readonly").objectStore(AUDIO_STORE).get(id);
    request.onsuccess = () => {database.close();resolve(request.result || null);};
    request.onerror = () => {database.close();reject(request.error);};
  });
}
async function getAudioFile(id) {
  const local = await getAudioFileLocal(id);
  if (local && local.blob) return local;
  if (cloudDB) {
    try {
      const docSnap = await cloudDB.collection("audio").doc(id).get();
      if (docSnap.exists) {
        const data = docSnap.data();
        if (data && data.audioData) {
          const blob = dataURLToBlob(data.audioData);
          await putAudioFileLocal(id, blob, data.name, data.type);
          return { id, blob, name: data.name, type: data.type };
        }
      }
    } catch(e) {
      console.warn("Could not fetch audio from Firestore", e);
    }
  }
  return null;
}
async function deleteAudioFile(id) {
  if (!id) return;
  try {
    const database = await openAudioDB();
    await new Promise((resolve,reject) => {
      const transaction = database.transaction(AUDIO_STORE,"readwrite");
      transaction.objectStore(AUDIO_STORE).delete(id);
      transaction.oncomplete = resolve;
      transaction.onerror = () => reject(transaction.error);
    });
    database.close();
  } catch(e) { console.warn("Could not delete stored audio",e); }
  if (cloudDB) {
    cloudDB.collection("audio").doc(id).delete().catch(e => console.warn("Cloud audio delete failed", e));
  }
}
function revokeAudioUrls() {
  audioObjectUrls.forEach(url => URL.revokeObjectURL(url));
  audioObjectUrls = [];
}
function loadDatabase() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved) {
      const list = Array.isArray(saved) ? saved : (saved.species || []);
      const normalized = list.map(normaliseSpecies);
      normalized.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
      return normalized;
    }
  } catch(e) { console.warn("Could not load saved database",e); }
  const initial = [
    starter("Marsh Tit","Poecile palustris","MT","Tits","Resident"),
    starter("Blue Tit","Cyanistes caeruleus","BT","Tits","Resident"),
    starter("Great Tit","Parus major","GT","Tits","Resident")
  ];
  initial.sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  return initial;
}
function starter(name,scientificName,btoCode,group="",status="") {
  return {id:uid(),name,scientificName,btoCode,group,status,habitat:"",photo:"",photoSourceUrl:"",vocalisations:[]};
}
function normaliseSpecies(s) {
  const vocalisations = s.vocalisations || s.vocalizations || [];
  return {
    id:s.id || uid(),
    name:s.name || s.commonName || "Unnamed species",
    scientificName:s.scientificName || s.scientific_name || "",
    btoCode:s.btoCode || s.bto || s.code || "",
    group:s.group || s.family || "",
    status:s.status || s.seasonality || "",
    habitat:s.habitat || "",
    photo:s.photo || s.image || "",
    photoSourceUrl:s.photoSourceUrl || "",
    vocalisations:Array.isArray(vocalisations) ? vocalisations.map(normaliseVocalisation) : []
  };
}
function normaliseVocalisation(v) {
  let recordings = v.recordings || [];
  if (!recordings.length && v.recordingUrls) {
    recordings = String(v.recordingUrls).split(/\n/).filter(Boolean).map(url => ({url}));
  }
  if (!recordings.length && v.audioUrl) recordings = [{url:v.audioUrl}];
  return {
    id:v.id || uid(),
    category:v.category || "Other",
    name:v.name || v.title || "Untitled vocalisation",
    description:v.description || "",
    mnemonic:v.mnemonic || v.phoneticMnemonic || "",
    variation:v.variation || "",
    context:v.context || v.behaviour || v.behavior || "",
    notes:v.notes || v.identificationNotes || "",
    recordings:recordings.map(r => typeof r === "string" ? {url:r} : ({
      url:r.url || r.audioUrl || "",
      sourceUrl:r.sourceUrl || "",
      audioId:r.audioId || "",
      name:r.name || r.title || "",
      start:r.start ?? r.startTime ?? "",
      end:r.end ?? r.endTime ?? ""
    }))
  };
}
function saveLocal() {
  try {
    sortDatabaseAlphabetically();
    localStorage.setItem(STORAGE_KEY,JSON.stringify(db));
  } catch(e) {
    console.warn("Local storage quota reached", e);
  }
}
function save(changedSpeciesId = null) {
  sortDatabaseAlphabetically();
  saveLocal();
  if (!cloudDB) return;
  setSyncStatus("Syncing…");
  if (changedSpeciesId) {
    const sp = db.find(s => s.id === changedSpeciesId);
    if (sp) {
      cloudDB.collection("species").doc(sp.id).set(JSON.parse(JSON.stringify(sp)))
        .then(() => setSyncStatus("● Online"))
        .catch(e => { console.warn(e); setSyncStatus("⚠ Sync error"); });
    }
  } else {
    Promise.all(db.map(sp => cloudDB.collection("species").doc(sp.id).set(JSON.parse(JSON.stringify(sp)))))
      .then(() => setSyncStatus("● Online"))
      .catch(e => { console.warn(e); setSyncStatus("⚠ Sync error"); });
  }
}

/* Push local species + audio to Firestore if cloud database is brand new */
async function uploadAllLocalToCloud() {
  if (!cloudDB) return;
  setSyncStatus("Initial cloud upload…");
  for (const sp of db) {
    await cloudDB.collection("species").doc(sp.id).set(JSON.parse(JSON.stringify(sp)));
    for (const v of sp.vocalisations || []) {
      for (const r of v.recordings || []) {
        if (r.audioId) {
          const localAudio = await getAudioFileLocal(r.audioId);
          if (localAudio && localAudio.blob) {
            const audioData = await blobToDataURL(localAudio.blob);
            await cloudDB.collection("audio").doc(r.audioId).set({
              id: r.audioId,
              audioData,
              name: localAudio.name || "audio recording",
              type: localAudio.type || localAudio.blob.type || "audio/mpeg",
              updatedAt: Date.now()
            });
          }
        }
      }
    }
  }
  setSyncStatus("● Online");
}

function initCloudSync() {
  if (!cloudDB) {
    setSyncStatus("Offline mode");
    return;
  }
  let firstSnapshot = true;
  cloudDB.collection("species").onSnapshot(snapshot => {
    if (firstSnapshot) {
      firstSnapshot = false;
      if (snapshot.empty && db.length > 0) {
        uploadAllLocalToCloud();
        return;
      }
    }
    const cloudSpecies = [];
    snapshot.forEach(doc => cloudSpecies.push(normaliseSpecies(doc.data())));
    if (cloudSpecies.length > 0 || !snapshot.empty) {
      db = cloudSpecies;
      sortDatabaseAlphabetically();
      saveLocal();
      if (!addingSpecies && !editingSpecies && !editingVocalisation) {
        render();
      }
    }
    setSyncStatus("● Online");
  }, err => {
    console.warn("Firestore listener error", err);
    setSyncStatus("Offline / Local");
  });
}

async function saveSpecies(event,id) {
  event.preventDefault();
  const form=event.target;
  const data=new FormData(form);
  let photo=data.get("keepPhoto")==="yes" ? (id ? db.find(s=>s.id===id)?.photo || "" : "") : "";
  const file=form.elements.photo.files[0];
  if(file) {
    try {photo=await compressImage(file);}
    catch(e) {alert("Could not read that photograph.");return;}
  }
  const fields={
    name:data.get("name").trim(),
    scientificName:data.get("scientificName").trim(),
    btoCode:data.get("btoCode").trim(),
    group:data.get("group").trim(),
    status:data.get("status").trim(),
    habitat:data.get("habitat").trim(),
    photo,
    photoSourceUrl:data.get("photoSourceUrl").trim()
  };
  let targetId = id;
  if(id) {
    Object.assign(db.find(s=>s.id===id),fields);
  } else {
    const created = {...starter(fields.name,fields.scientificName,fields.btoCode,fields.group,fields.status),...fields};
    targetId = created.id;
    db.push(created);
  }
  save(targetId);addingSpecies=false;editingSpecies=false;render();
}
async function compressImage(file) {
  if(!file.type.startsWith("image/")) throw new Error("Please choose an image file.");
  return new Promise((resolve,reject) => {
    const reader=new FileReader();
    reader.onerror=reject;
    reader.onload=() => {
      const img=new Image();
      img.onerror=reject;
      img.onload=() => {
        const max=1200;
        const scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.round(img.width*scale);
        canvas.height=Math.round(img.height*scale);
        canvas.getContext("2d").drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg",0.78));
      };
      img.src=reader.result;
    };
    reader.readAsDataURL(file);
  });
}

async function hydrateAudioPlayers(s) {
  const players=[...app.querySelectorAll("audio[data-audio-id]")];
  for(const player of players) {
    const id=player.dataset.audioId;
    try {
      const stored=await getAudioFile(id);
      if(!stored || !stored.blob) {
        player.insertAdjacentHTML("afterend",'<small>Stored audio file not found.</small>');
        continue;
      }
      const url=URL.createObjectURL(stored.blob);
      audioObjectUrls.push(url);
      player.src=url;
      player.load();
    } catch(e) {
      console.warn("Could not load audio file",e);
      player.insertAdjacentHTML("afterend",'<small>Could not load this audio file.</small>');
    }
  }
}
function setupExclusiveAudio() {
  const allAudio = document.querySelectorAll("audio");
  allAudio.forEach(audio => {
    if (audio.dataset.exclusiveSetup) return;
    audio.dataset.exclusiveSetup = "yes";
    audio.addEventListener("play", () => {
      allAudio.forEach(other => {
        if (other !== audio && !other.paused) {
          other.pause();
        }
      });
    });
  });
}
function moveVocalisation(vocalId, direction) {
  const s = currentSpecies();
  if (!s) return;
  const index = s.vocalisations.findIndex(v => v.id === vocalId);
  if (index < 0) return;
  const newIndex = index + direction;
  if (newIndex < 0 || newIndex >= s.vocalisations.length) return;
  const item = s.vocalisations.splice(index, 1)[0];
  s.vocalisations.splice(newIndex, 0, item);
  save(s.id);
  renderSpecies();
}
function formatTime(seconds) {
  seconds=Math.max(0,Number(seconds)||0);
  const m=Math.floor(seconds/60),s=Math.floor(seconds%60);
  return `${m}:${String(s).padStart(2,"0")}`;
}

async function saveVocalisation(event,id) {
  event.preventDefault();
  const form=event.target;
  const data=new FormData(form);
  const rows=[...form.querySelectorAll(".recording-form")];
  const recordings=[];
  const newlyStoredIds=[];
  try {
    for(const row of rows) {
      const file=row.querySelector('[name="recordingFile"]').files[0];
      const oldAudioId=row.querySelector('[name="recordingAudioId"]').value;
      const oldUrl=row.querySelector('[name="recordingOldUrl"]').value;
      const sourceUrl=row.querySelector('[name="recordingSourceUrl"]').value.trim();
      const name=row.querySelector('[name="recordingName"]').value.trim();
      let audioId=oldAudioId;
      if(file) {
        if(!file.type.startsWith("audio/") && !/\.(mp3|wav|ogg|m4a|aac)$/i.test(file.name)) {
          throw new Error("Please choose a recognised audio file.");
        }
        audioId=uid();
        await putAudioFile(audioId,file);
        newlyStoredIds.push(audioId);
      }
      const url=audioId ? "" : (sourceUrl || oldUrl);
      if(audioId || url) {
        recordings.push({
          audioId,
          url,
          sourceUrl:sourceUrl || (audioId ? "" : url),
          name,
          start:"",
          end:""
        });
      }
    }
  } catch(e) {
    for(const newId of newlyStoredIds) await deleteAudioFile(newId);
    alert(e.message || "There was a problem saving the audio file.");
    return;
  }

  const v={
    id:id || uid(),
    category:data.get("category"),
    name:data.get("name").trim(),
    mnemonic:data.get("mnemonic").trim(),
    description:data.get("description").trim(),
    variation:data.get("variation").trim(),
    context:data.get("context").trim(),
    notes:data.get("notes").trim(),
    recordings
  };
  const s=currentSpecies();
  if(id) {
    const index=s.vocalisations.findIndex(x=>x.id===id);
    if(index>=0) {
      const old=s.vocalisations[index];
      const retained=new Set(recordings.map(r=>r.audioId).filter(Boolean));
      for(const oldRecording of old.recordings || []) {
        if(oldRecording.audioId && !retained.has(oldRecording.audioId)) {
          await deleteAudioFile(oldRecording.audioId);
        }
      }
      s.vocalisations[index]=v;
    }
  } else s.vocalisations.push(v);
  save(s.id);
  editingVocalisation=null;
  renderSpecies();
}
function editSpecies() {editingSpecies=true;renderSpecies();}
async function deleteSpecies() {
  const s=currentSpecies();
  if(!confirm(`Delete ${s.name} and all its vocalisations? This cannot be undone.`))return;
  for(const v of s.vocalisations) {
    for(const r of v.recordings || []) if(r.audioId) await deleteAudioFile(r.audioId);
  }
  db=db.filter(x=>x.id!==s.id);
  saveLocal();
  if (cloudDB) {
    cloudDB.collection("species").doc(s.id).delete().catch(e => console.warn(e));
  }
  goHome();
}
async function deleteVocalisation(id) {
  const s=currentSpecies();
  const v=s.vocalisations.find(x=>x.id===id);
  if(!confirm(`Delete "${v.name}"?`))return;
  for(const r of v.recordings || []) if(r.audioId) await deleteAudioFile(r.audioId);
  s.vocalisations=s.vocalisations.filter(x=>x.id!==id);
  save(s.id);renderSpecies();
}
function setupAudioClips() {
  document.querySelectorAll("audio[data-start],audio[data-end]").forEach(audio=>{
    if(audio.dataset.clipSetup)return;
    audio.dataset.clipSetup="yes";
    let initialised=false;
    const start=audio.dataset.start==="" ? null : Number(audio.dataset.start);
    const end=audio.dataset.end==="" ? null : Number(audio.dataset.end);
    audio.addEventListener("play",()=>{
      if(!initialised && start!==null) {
        audio.currentTime=start;initialised=true;
      }
      if(end!==null && audio.currentTime>=end) audio.currentTime=start!==null?start:0;
    });
    audio.addEventListener("timeupdate",()=>{
      if(end!==null && audio.currentTime>=end) {
        audio.pause();audio.currentTime=end;
      }
    });
    audio.addEventListener("seeked",()=>{
      if(end!==null && audio.currentTime>end)audio.currentTime=end;
    });
    audio.addEventListener("ended",()=>{initialised=false;});
  });
}

/* Convert a stored audio Blob to a data URL for portable JSON backups and cloud sync. */
function blobToDataURL(blob) {
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(reader.result);
    reader.onerror=()=>reject(reader.error);
    reader.readAsDataURL(blob);
  });
}
function dataURLToBlob(dataURL) {
  const parts=dataURL.split(",");
  const mime=(parts[0].match(/:(.*?);/) || [,"application/octet-stream"])[1];
  const binary=atob(parts[1]);
  const bytes=new Uint8Array(binary.length);
  for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);
  return new Blob([bytes],{type:mime});
}
async function exportBackup() {
  try {
    const backupSpecies=JSON.parse(JSON.stringify(db));
    for(const s of backupSpecies) {
      for(const v of s.vocalisations || []) {
        for(const r of v.recordings || []) {
          if(r.audioId) {
            const stored=await getAudioFile(r.audioId);
            if(stored?.blob) {
              r.audioData=await blobToDataURL(stored.blob);
              r.audioFileName=stored.name || "recording";
              r.audioType=stored.type || stored.blob.type || "audio/mpeg";
            } else {
              throw new Error(`An audio file is missing from storage (${r.name || r.audioId}).`);
            }
          }
        }
      }
    }
    const backup={
      format:"British Bird Vocalisation Library",
      version:4,
      exported:new Date().toISOString(),
      species:backupSpecies
    };
    const blob=new Blob([JSON.stringify(backup,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url;
    a.download="bird-database-backup.json";
    a.click();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  } catch(e) {
    alert("Could not export the backup: " + e.message);
  }
}
async function importBackup(event) {
  const file=event.target.files[0];
  if(!file)return;
  try {
    const text=await file.text();
    const data=JSON.parse(text);
    const list=Array.isArray(data)?data:data.species;
    if(!Array.isArray(list))throw new Error("Invalid backup");
    if(!confirm("Import this backup and replace the species currently in your database? Export your current database first if you want to keep it."))return;

    const imported=list.map(normaliseSpecies);
    for(let i=0;i<list.length;i++) {
      const sourceSpecies=list[i];
      const targetSpecies=imported[i];
      const sourceVocalisations=sourceSpecies.vocalisations || sourceSpecies.vocalizations || [];
      for(let j=0;j<sourceVocalisations.length;j++) {
        const sourceRecordings=sourceVocalisations[j].recordings || [];
        const targetRecordings=targetSpecies.vocalisations[j]?.recordings || [];
        for(let k=0;k<sourceRecordings.length;k++) {
          const sourceRecording=typeof sourceRecordings[k]==="string" ? {url:sourceRecordings[k]} : sourceRecordings[k];
          const targetRecording=targetRecordings[k];
          if(sourceRecording.audioData && targetRecording) {
            const blob=dataURLToBlob(sourceRecording.audioData);
            const audioId=uid();
            await putAudioFile(audioId,new File([blob],sourceRecording.audioFileName || "recording",{
              type:sourceRecording.audioType || blob.type || "audio/mpeg"
            }));
            targetRecording.audioId=audioId;
            targetRecording.url="";
            delete targetRecording.audioData;
          }
        }
      }
    }
    if (cloudDB) {
      const existing = await cloudDB.collection("species").get();
      const newIds = new Set(imported.map(s => s.id));
      for (const docSnap of existing.docs) {
        if (!newIds.has(docSnap.id)) await docSnap.ref.delete();
      }
    }
    db=imported;
    sortDatabaseAlphabetically();
    save();
    goHome();
    alert("Backup imported and synced to the cloud.");
  } catch(e) {
    console.error(e);
    alert("That file could not be imported. It may not be a valid backup, or the browser may have run out of storage.");
  } finally {
    event.target.value="";
  }
}

/* Import species table and embedded images directly from Bird Calls & Song.docx */
async function importWordDoc(event) {
  const file = event.target.files[0];
  if (!file) return;
  try {
    setSyncStatus("Reading Word doc…");
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.convertToHtml({ arrayBuffer });
    const doc = new DOMParser().parseFromString(result.value, "text/html");
    const rows = [...doc.querySelectorAll("table tr")];
    if (rows.length < 2) throw new Error("No table found in the Word document.");

    let added = 0, updated = 0;
    const cleanCell = (el) => {
      if (!el) return "";
      const clone = el.cloneNode(true);
      clone.querySelectorAll("img").forEach(img => img.remove());
      return clone.textContent.replace(/\s+\n/g, "\n").trim();
    };
    const isEmptyOrNA = (str) => !str || /^n\/?a$/i.test(str) || /^page \d+/i.test(str);

    for (let i = 1; i < rows.length; i++) {
      const cells = [...rows[i].querySelectorAll("td, th")];
      if (cells.length < 2) continue;

      const name = cleanCell(cells[0]);
      const btoCode = cleanCell(cells[1]);
      const songDesc = cleanCell(cells[2]);
      const songMnem = cleanCell(cells[3]);
      const callDesc = cleanCell(cells[4]);
      const callMnem = cleanCell(cells[5]);
      const notes = cleanCell(cells[6]);
      const habitat = cleanCell(cells[7]);

      if (!name || (!btoCode && isEmptyOrNA(songDesc) && isEmptyOrNA(callDesc))) continue;

      let photo = "";
      const imgEl = cells[0].querySelector("img");
      if (imgEl && imgEl.src) {
        try {
          const res = await fetch(imgEl.src);
          const blob = await res.blob();
          photo = await compressImage(new File([blob], "bird.jpg", { type: blob.type || "image/jpeg" }));
        } catch (e) { console.warn("Skipped image for", name, e); }
      }

      const newVocalisations = [];
      const hasSong = !isEmptyOrNA(songDesc) || !isEmptyOrNA(songMnem);
      const hasCall = !isEmptyOrNA(callDesc) || !isEmptyOrNA(callMnem);

      if (hasSong) {
        newVocalisations.push({
          id: uid(),
          category: "Song",
          name: "Typical song",
          description: isEmptyOrNA(songDesc) ? "" : songDesc,
          mnemonic: isEmptyOrNA(songMnem) ? "" : songMnem,
          variation: "",
          context: "",
          notes: !hasCall ? notes : "",
          recordings: []
        });
      }
      if (hasCall) {
        newVocalisations.push({
          id: uid(),
          category: "Contact call",
          name: "Calls",
          description: isEmptyOrNA(callDesc) ? "" : callDesc,
          mnemonic: isEmptyOrNA(callMnem) ? "" : callMnem,
          variation: "",
          context: "",
          notes: notes,
          recordings: []
        });
      } else if (!hasSong && notes) {
        newVocalisations.push({
          id: uid(),
          category: "Other",
          name: "Identification notes",
          description: "",
          mnemonic: "",
          variation: "",
          context: "",
          notes: notes,
          recordings: []
        });
      }

      const existing = db.find(s => s.name.toLowerCase() === name.toLowerCase());
      if (existing) {
        if (btoCode && !existing.btoCode) existing.btoCode = btoCode;
        if (habitat && !existing.habitat) existing.habitat = habitat;
        if (photo && !existing.photo) existing.photo = photo;
        if (existing.vocalisations.length === 0 && newVocalisations.length > 0) {
          existing.vocalisations = newVocalisations;
        }
        updated++;
      } else {
        db.push({
          id: uid(),
          name,
          scientificName: "",
          btoCode,
          group: "",
          status: "",
          habitat,
          photo,
          photoSourceUrl: "",
          vocalisations: newVocalisations
        });
        added++;
      }
    }

    sortDatabaseAlphabetically();
    save();
    render();
    alert(`Word import complete: ${added} new species added, ${updated} existing species updated.`);
  } catch (e) {
    console.error(e);
    alert("Could not import Word document: " + e.message);
    setSyncStatus("● Online");
  } finally {
    event.target.value = "";
  }
}

render();
initCloudSync();
</script>
<script>
/* Retain support for older recordings that use start/end clip times. */
const audioObserver=new MutationObserver(()=>setupAudioClips());
audioObserver.observe(document.getElementById("app"),{childList:true,subtree:true});
setupAudioClips();
</script>
